<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vively Performance Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #fbfbfe;
      --text: #14161c;
      --muted: #5c6474;
      --subtle: #9aa1ae;
      --line: rgba(15, 23, 42, 0.09);
      --line-strong: rgba(15, 23, 42, 0.17);
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --mint: #0ea371;
      --gold: #f59e0b;
      --radius: 18px;
      --radius-sm: 12px;
      --max-width: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    .glow-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .glow {
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.1;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow.g1 { background: var(--accent); top: -220px; left: -160px; }
    .glow.g2 { background: var(--accent-2); top: 30%; right: -260px; animation-delay: -6s; }
    .glow.g3 { background: #2563eb; bottom: -240px; left: 25%; animation-delay: -12s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, -50px) scale(1.12); }
    }
    .report { position: relative; z-index: 1; max-width: var(--max-width); margin: 0 auto; padding: 56px 40px 90px; }
    .hero { padding: 44px 0 40px; border-bottom: 1px solid var(--line); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 7px 14px;
      background: rgba(15, 23, 42, 0.03);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .title { font-size: 60px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 20px; }
    .title .grad {
      background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 60%, var(--gold) 120%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: #4a5264; line-height: 1.5; max-width: 820px; }
    .section { padding: 46px 0; border-bottom: 1px solid var(--line); }
    .section h2 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; }
    .section h2 .num { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 8px; }
    .section-intro { color: var(--muted); max-width: 860px; margin: 0 0 26px; font-size: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: 0 18px 44px rgba(15, 23, 42, 0.1); }
    .kpi.card { position: relative; overflow: hidden; }
    .kpi.hot {
      border: 1px solid transparent;
      background:
        linear-gradient(180deg, var(--surface), var(--surface-2)) padding-box,
        linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
      box-shadow: 0 0 34px rgba(139, 92, 246, 0.14);
    }
    .kpi.hot::after {
      content: "";
      position: absolute;
      top: 0; left: -80%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(139, 92, 246, 0.06), transparent);
      animation: sheen 4.5s ease-in-out infinite;
    }
    @keyframes sheen { 0% { left: -80%; } 55%, 100% { left: 130%; } }
    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .kpi-value { font-size: 38px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .kpi.hot .kpi-value {
      background: linear-gradient(92deg, #6d28d9, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .kpi-note { font-size: 13.5px; color: var(--muted); }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(14, 163, 113, 0.1);
      color: var(--mint);
      border: 1px solid rgba(14, 163, 113, 0.35);
    }
    .tag.violet { background: rgba(139, 92, 246, 0.1); color: #6d4fd0; border-color: rgba(139, 92, 246, 0.35); }
    .insight {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: rgba(139, 92, 246, 0.06);
      font-size: 14.5px;
      color: #454d5f;
    }
    .insight strong { color: var(--text); }
    .note-box {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.02);
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .case-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
    .list { margin: 0; padding-left: 18px; color: #3b4252; }
    .list li { margin-bottom: 9px; }
    .list li::marker { color: var(--accent); }
    .metric-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .metric-strip.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .metric-mini { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; background: rgba(15, 23, 42, 0.02); }
    .metric-mini.win { border-color: rgba(14, 163, 113, 0.4); background: rgba(14, 163, 113, 0.06); }
    .metric-mini span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .metric-mini strong { font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .metric-mini.win strong { color: var(--mint); }
    .chart-card { padding-bottom: 16px; }
    .chart-wrap { position: relative; width: 100%; height: 320px; }
    .live-badge {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--mint);
    }
    .reel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
    .reel {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: var(--subtle);
      font-size: 12.5px;
      overflow: hidden;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .reel:hover { border-color: var(--accent); background-color: rgba(139, 92, 246, 0.08); transform: translateY(-3px); }
    .reel video, .reel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .reel .ico {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong);
      font-size: 15px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.03);
    }
    .reel.filled { border-style: solid; border-color: var(--line-strong); }
    .reel.filled .reel-hint { opacity: 0; }
    .reel .reel-hint { padding: 0 12px; transition: opacity 0.3s; }
    .reel .ratio-tag { position: absolute; bottom: 10px; font-size: 10px; letter-spacing: 0.1em; color: var(--subtle); }
    .reel.filled .ratio-tag, .reel.filled .ico { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; vertical-align: top; padding: 13px 10px; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    td { color: #3b4252; }
    .quote-box {
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 30px;
      font-size: 21px;
      line-height: 1.55;
      letter-spacing: -0.015em;
      background:
        linear-gradient(180deg, var(--surface), var(--surface-2)) padding-box,
        linear-gradient(135deg, rgba(139,92,246,.6), rgba(236,72,153,.6)) border-box;
      color: #2b3242;
    }
    .footer { font-size: 13px; color: var(--muted); line-height: 1.7; padding-top: 28px; }
    .footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.in { opacity: 1; transform: none; }
    @media (max-width: 1024px) {
      .grid-4, .grid-2, .metric-strip { grid-template-columns: 1fr; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }
      .title { font-size: 42px; }
      .subtitle { font-size: 19px; }
      .report { padding: 32px 20px 60px; }
      .chart-wrap { height: 280px; }
    }
  </style>
</head>
<body>
  <div class="glow-field">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
  </div>

  <div class="report" id="app"></div>

  <script>
  /* ═════════════════════════════════════════════════════════════════════
     ★★★  데이터 블록 — 여기만 수정하면 됩니다  ★★★
     ─────────────────────────────────────────────────────────────────────
     새 프로젝트 추가 방법:
       1. REPORT.projects 배열에 기존 항목을 복사해 붙여넣고 값만 바꾸세요.
       2. 영상/이미지는 media 폴더에 "<id>-1.mp4" ~ "<id>-4.mp4"로 저장하세요.

     ═════════════════════════════════════════════════════════════════════ */

          total: 389653,
          insight: "조회수 볼륨이 충분히 형성되었고, 좋아요·댓글·공유 반응이 후행하며 브랜드 인지도와 관심도를 함께 보여줍니다.",

      {

        "<tr><td><strong>" + esc(p.name) + "</strong></td><td>" + esc(p.budgetText) +
        '</td><td><strong style="color: var(--mint);">' + esc(p.salesText) + "</strong></td><td>" + esc(p.salesInterpretation) + "</td></tr>"
      ).join("") +
      "</tbody></table>" +
      (R.budgetSalesNote ? '<div class="note-box">' + esc(R.budgetSalesNote) + "</div>" : "") +
      "</div></div></section>"
    );

    /* geo */
    sectionNo++;
    parts.push(
      '<section class="section reveal">' +
      '<h2><span class="num">' + num2(sectionNo) + " — GLOBAL REACH</span>글로벌 도달 범위</h2>" +
      '<div class="grid-2">' +
      '<div class="card chart-card"><div class="label">Geographic Reach ' + liveBadge + "</div>" +
      '<div class="chart-wrap"><canvas id="geoChart"></canvas></div>' +
      '<div class="insight"><strong>인사이트</strong> — ' + esc(R.geoInsight) + "</div></div>" +
      '<div class="card"><table><thead><tr><th>브랜드</th><th>도달 국가/권역</th><th>해석</th></tr></thead><tbody>' +
      R.projects.map((p) =>
        "<tr><td><strong>" + esc(p.name) + "</strong></td><td>" + esc(p.countries) + "</td><td>" + esc(p.geoInterpretation) + "</td></tr>"
      ).join("") +
      "</tbody></table></div></div></section>"
    );

    /* why + footer */
    sectionNo++;
    parts.push(
      '<section class="section reveal">' +
      '<h2><span class="num">' + num2(sectionNo) + " — WHY VIVELY</span>왜 신규 한국 클라이언트가 주목해야 하는가</h2>" +
      '<div class="grid-2">' +
      '<div class="card"><div class="case-title">설득 포인트</div>' + listHtml(R.whyPoints.map(esc)) + "</div>" +
      '<div class="quote-box">' + esc(R.quote) + "</div></div>" +
      '<div class="footer">Source PDF: <a href="' + R.footer.sourceUrl + '" target="_blank">' + esc(R.footer.sourceName) + "</a><br /><br />" +
      esc(R.footer.note) + "</div></section>"
    );

    document.getElementById("app").innerHTML = parts.join("");

    /* ============ chart plumbing ============ */
    function vGradient(ctx, area, from, to) {
      const g = ctx.createLinearGradient(0, area.bottom, 0, area.top);
      g.addColorStop(0, from);
      g.addColorStop(1, to);
      return g;
    }
    const valueLabels = {
      id: "valueLabels",
      afterDatasetsDraw(chart, _, opts) {
        const { ctx } = chart;
        const horizontal = chart.options.indexAxis === "y";
        const fmt = opts.formatter || ((v) => (opts.prefix || "") + Math.round(v).toLocaleString() + (opts.suffix || ""));
        ctx.save();
        ctx.font = "700 12px Pretendard, sans-serif";
        ctx.fillStyle = "#1a1d26";
        chart.data.datasets.forEach((ds, di) => {
          const meta = chart.getDatasetMeta(di);
          if (!meta || meta.hidden) return;
          meta.data.forEach((bar, i) => {
            const text = fmt(ds.data[i]);
            if (horizontal) {
              ctx.textAlign = "left"; ctx.textBaseline = "middle";
              ctx.fillText(text, bar.x + 8, bar.y);
            } else {
              ctx.textAlign = "center"; ctx.textBaseline = "bottom";
              ctx.fillText(text, bar.x, bar.y - 6);
            }
          });
        });
        ctx.restore();
      }
    };
    const logTicks = {
      color: axisColor,
      autoSkip: false,
      callback: (v) => {
        const log = Math.log10(v);
        return Number.isInteger(log) ? v.toLocaleString() : null;
      }
    };

    const charts = {};       // id → Chart instance
    const baseData = {};     // id → original data (for live breathing)

    /* CPM chart: benchmarks (gray) + one colored bar per project that defines a cpm value */
    const cpmProjects = R.projects.filter((p) => p.cpm != null);
    const cpmLabels = R.cpmBenchmarks.map((b) => b.label).concat(cpmProjects.map((p) => p.name + " ✦"));
    const cpmValues = R.cpmBenchmarks.map((b) => b.value).concat(cpmProjects.map((p) => p.cpm));
    const nBench = R.cpmBenchmarks.length;
    charts.cpmChart = new Chart(document.getElementById("cpmChart"), {
      type: "bar",
      data: {
        labels: cpmLabels,
        datasets: [{
          data: cpmValues.slice(),
          backgroundColor: (c) => {
            const { ctx, chartArea } = c.chart;
            if (!chartArea) return GRAY;
            if (c.dataIndex >= nBench) {
              const [a, b] = projColor(c.dataIndex - nBench);
              return vGradient(ctx, chartArea, a, b);
            }
            return vGradient(ctx, chartArea, "rgba(15,23,42,0.1)", GRAY2);
          },
          borderRadius: 8, borderSkipped: false, maxBarThickness: 58
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 1400, easing: "easeOutQuart", delay: (c) => c.dataIndex * 130 },
        plugins: {
          legend: { display: false },
          valueLabels: { prefix: "₩" },
          tooltip: { callbacks: { label: (ctx) => " ₩" + Math.round(ctx.raw).toLocaleString() } }
        },
        scales: {
          x: { ticks: { color: axisColor, maxRotation: 0, minRotation: 0 }, grid: { display: false } },
          y: { ticks: { color: axisColor, callback: (v) => "₩" + v.toLocaleString() }, grid: { color: gridColor } }
        }
      },
      plugins: [valueLabels]
    });
    baseData.cpmChart = cpmValues;

    /* engagement chart per project (skips metrics a project doesn't report, e.g. no "likes" data) */
    R.projects.forEach((p) => {
      const id = "eng-" + p.id;
      const e = p.engagement;
      const engPairs = [["Views", e.views], ["Likes", e.likes], ["Comments", e.comments], ["Shares", e.shares]]
        .filter(([, v]) => v != null);
      const engLabels = engPairs.map(([l]) => l);
      const vals = engPairs.map(([, v]) => v);
      charts[id] = new Chart(document.getElementById(id), {
        type: "bar",
        data: {
          labels: engLabels,
          datasets: [{
            data: vals.slice(),
            backgroundColor: (c) => {
              const { ctx, chartArea } = c.chart;
              if (!chartArea) return VIOLET;
              const pairs = [
                ["rgba(139,92,246,0.45)", VIOLET],
                ["rgba(236,72,153,0.4)", PINK],
                ["rgba(15,23,42,0.12)", GRAY2],
                ["rgba(15,23,42,0.08)", GRAY]
              ];
              const [a, b] = pairs[c.dataIndex];
              return vGradient(ctx, chartArea, a, b);
            },
            borderRadius: 8, borderSkipped: false, maxBarThickness: 72
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 1400, easing: "easeOutQuart", delay: (c) => c.dataIndex * 160 },
          plugins: {
            legend: { display: false },
            valueLabels: {},
            tooltip: { callbacks: { label: (ctx) => " " + Math.round(ctx.raw).toLocaleString() } }
          },
          scales: {
            x: { ticks: { color: axisColor }, grid: { display: false } },
            y: { type: "logarithmic", min: 10, ticks: Object.assign({}, logTicks), grid: { color: gridColor } }
          }
        },
        plugins: [valueLabels]
      });
      baseData[id] = vals;
    });

    /* budget vs sales (grouped) — only projects that report an actual sales/revenue signal */
    const salesProjects = R.projects.filter((p) => p.sales != null);
    charts.budgetSalesChart = new Chart(document.getElementById("budgetSalesChart"), {
      type: "bar",
      data: {
        labels: salesProjects.map((p) => p.name),
        datasets: [
          {
            label: "예산",
            data: salesProjects.map((p) => p.budget),
            backgroundColor: GRAY2,
            borderRadius: 8, borderSkipped: false, maxBarThickness: 58
          },
          {
            label: "매출 신호",
            data: salesProjects.map((p) => p.sales),
            backgroundColor: (c) => {
              const { ctx, chartArea } = c.chart;
              if (!chartArea) return MINT;
              return vGradient(ctx, chartArea, "rgba(16,185,129,0.5)", MINT);
            },
            borderRadius: 8, borderSkipped: false, maxBarThickness: 58
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 1400, easing: "easeOutQuart", delay: (c) => c.dataIndex * 180 + c.datasetIndex * 120 },
        plugins: {
          legend: { position: "top", labels: { color: axisColor, usePointStyle: true, pointStyle: "circle" } },
          valueLabels: { formatter: (v) => Math.round(v / 10000).toLocaleString() + "만" },
          tooltip: { callbacks: { label: (ctx) => " " + ctx.dataset.label + ": ₩" + Math.round(ctx.raw).toLocaleString() } }
        },
        scales: {
          x: { ticks: { color: axisColor, font: { size: 13, weight: "700" } }, grid: { display: false } },
          y: { ticks: { color: axisColor, callback: (v) => (v / 10000).toLocaleString() + "만원" }, grid: { color: gridColor } }
        }
      },
      plugins: [valueLabels]
    });

    /* geo (horizontal) */
    charts.geoChart = new Chart(document.getElementById("geoChart"), {
      type: "bar",
      data: {
        labels: R.projects.map((p) => p.name),
        datasets: [{
          label: "도달 국가/권역 수",
          data: R.projects.map((p) => p.geoCount),
          backgroundColor: (c) => {
            const { ctx, chartArea } = c.chart;
            if (!chartArea) return VIOLET;
            const g = ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
            const [a, b] = projColor(c.dataIndex);
            g.addColorStop(0, a); g.addColorStop(1, b);
            return g;
          },
          borderRadius: 8, borderSkipped: false, maxBarThickness: 54
        }]
      },
      options: {
        indexAxis: "y",
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 1400, easing: "easeOutQuart", delay: (c) => c.dataIndex * 200 },
        plugins: { legend: { display: false }, valueLabels: { suffix: "개 권역" } },
        scales: {
          x: {
            beginAtZero: true,
            max: Math.max(...R.projects.map((p) => p.geoCount)) + 1,
            ticks: { stepSize: 1, color: axisColor },
            grid: { color: gridColor }
          },
          y: { ticks: { color: axisColor, font: { size: 14, weight: "700" } }, grid: { display: false } }
        }
      },
      plugins: [valueLabels]
    });

    /* project-specific "extra" charts (e.g. LaBab's PVV benchmark) */
    R.projects.forEach((p) => {
      if (!p.extra) return;
      const x = p.extra;
      const cd = x.chartData;
      charts[x.chartId] = new Chart(document.getElementById(x.chartId), {
        type: "bar",
        data: {
          labels: cd.labels,
          datasets: [{
            data: cd.values.slice(),
            backgroundColor: (c) => {
              const { ctx, chartArea } = c.chart;
              if (!chartArea) return GRAY;
              if (c.dataIndex === cd.highlightIndex) return vGradient(ctx, chartArea, "rgba(16,185,129,0.5)", MINT);
              return vGradient(ctx, chartArea, "rgba(15,23,42,0.1)", GRAY2);
            },
            borderRadius: 8, borderSkipped: false, maxBarThickness: 72
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 1400, easing: "easeOutQuart", delay: (c) => c.dataIndex * 160 },
          plugins: {
            legend: { display: false },
            valueLabels: { prefix: "₩", suffix: "/뷰" },
            tooltip: { callbacks: { label: (ctx) => " ₩" + Math.round(ctx.raw).toLocaleString() + "/뷰" } }
          },
          scales: {
            x: { ticks: { color: axisColor, font: { size: 12, weight: "700" } }, grid: { display: false } },
            y: { ticks: { color: axisColor, callback: (v) => "₩" + v }, grid: { color: gridColor } }
          }
        },
        plugins: [valueLabels]
      });
      baseData[x.chartId] = cd.values.slice();
    });

    /* replay chart animation on scroll into view */
    const chartObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const ch = charts[e.target.id];
          if (ch) { ch.reset(); ch.update(); }
        }
      });
    }, { threshold: 0.4 });
    Object.keys(charts).forEach((id) => chartObserver.observe(document.getElementById(id)));

    /* gentle "live breathing" on cpm + engagement charts */
    setInterval(() => {
      Object.keys(baseData).forEach((id) => {
        const ch = charts[id];
        ch.data.datasets[0].data = baseData[id].map((v) => v * (1 + (Math.random() - 0.5) * 0.012));
        ch.update({ duration: 1600, easing: "easeInOutSine" });
      });
    }, 2600);

    /* ============ count-up numbers ============ */
    function countUp(el) {
      const target = +el.dataset.target;
      const dur = 1800;
      const start = performance.now();
      function frame(now) {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 4);
        el.textContent = Math.round(target * eased).toLocaleString();
        if (p < 1) requestAnimationFrame(frame);
        else if (el.classList.contains("tick")) startTicker(el, target);
      }
      requestAnimationFrame(frame);
    }
    function startTicker(el, base) {
      let v = base;
      setInterval(() => {
        v += Math.floor(Math.random() * 3) + 1;
        el.textContent = v.toLocaleString();
      }, 2200);
    }
    const countObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !e.target.dataset.done) {
          e.target.dataset.done = "1";
          countUp(e.target);
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll(".count").forEach((el) => countObserver.observe(el));

    /* ============ reveal on scroll ============ */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));

    /* ============ reel media slots (4 per project, 9:16) ============
       Files load from ./media — "<id>-1.mp4" … "<id>-4.mp4"
       Formats tried in order: .mp4 → .webm → .gif → .jpg → .png */
    const EXTS = ["mp4", "webm", "gif", "jpg", "png"];
    function tryLoad(slot, name, extIndex) {
      if (extIndex >= EXTS.length) return;
      const ext = EXTS[extIndex];
      const src = "media/" + name + "." + ext;
      if (ext === "mp4" || ext === "webm") {
        const v = document.createElement("video");
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.addEventListener("loadeddata", () => { slot.classList.add("filled"); v.play().catch(() => {}); });
        v.addEventListener("error", () => { v.remove(); tryLoad(slot, name, extIndex + 1); });
        v.src = src;
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.alt = name;
        img.addEventListener("load", () => slot.classList.add("filled"));
        img.addEventListener("error", () => { img.remove(); tryLoad(slot, name, extIndex + 1); });
        img.src = src;
        slot.appendChild(img);
      }
    }
    R.projects.forEach((p) => {
      const wrap = document.getElementById("reels-" + p.id);
      for (let i = 1; i <= 4; i++) {
        const name = p.id + "-" + i;
        const slot = document.createElement("div");
        slot.className = "reel";
        slot.innerHTML =
          '<div class="ico">▶</div>' +
          '<div class="reel-hint">media/' + name + ".mp4<br />파일을 media 폴더에 넣으면 자동 표시</div>" +
          '<span class="ratio-tag">REELS · 1080 × 1920</span>';
        tryLoad(slot, name, 0);
        wrap.appendChild(slot);
      }
    });
  </script>
</body>
</html>
